name: Collecte aviation privée
on:
  schedule:
    - cron: '7,37 * * * *'   # minutes décalées : moins sautées par GitHub que :00/:30
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: aviation-collect, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-aviation.mjs
      - run: |
          git config user.name "aviation-collect[bot]"
          git config user.email "actions@github.com"
          git add src/data/aviation-live.json src/data/aviation-30j.json
          git diff --cached --quiet || git commit -m "chore(data): instantané aviation"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 10; done

  # Le push ci-dessus utilise le GITHUB_TOKEN et ne déclenche donc pas deploy.yml
  # (garde-fou anti-récursion de GitHub) : on appelle le déploiement explicitement.
  deploy:
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
