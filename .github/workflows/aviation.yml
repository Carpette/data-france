name: Collecte aviation privée
on:
  schedule:
    - cron: '0,30 0-23 * * *'   # 4 passages/jour
  workflow_dispatch:
permissions: { contents: write }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-aviation.mjs
      - run: |
          git config user.name "aviation-collect[bot]"
          git config user.email "actions@github.com"
          git add src/data/aviation-live.json src/data/aviation-30j.json
          git diff --cached --quiet || git commit -m "chore(data): instantané aviation"
          git push

  # Le push ci-dessus utilise le GITHUB_TOKEN et ne déclenche donc pas deploy.yml
  # (garde-fou anti-récursion de GitHub) : on appelle le déploiement explicitement.
  deploy:
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
